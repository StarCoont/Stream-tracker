<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stream Tracker</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0E12; padding: 1rem; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const data = null;
    const sendToAgent = () => {};
    const widgetLog = () => {};
    const Card = ({children,style}) => <div style={style}>{children}</div>;
    const CardHeader = ({children,style}) => <div style={style}>{children}</div>;
    const CardContent = ({children,style}) => <div style={style}>{children}</div>;
    const CardTitle = ({children,style}) => <div style={style}>{children}</div>;
    const CardDescription = ({children,style}) => <div style={style}>{children}</div>;

   
  function ArenaBreakoutStreamStats() {
  const [sessionStartTime] = React.useState(Date.now());
  const [elapsedSeconds, setElapsedSeconds] = React.useState(0);
  const [stats, setStats] = React.useState({
    redZones: data?.stats?.redZones?.value ?? 3,
    kills: data?.stats?.kills?.value ?? 12,
    koenEarned: data?.stats?.koenEarned?.value ?? 47500,
    raidsCompleted: data?.stats?.raidsCompleted?.value ?? 5,
  });
  const [koenInputValue, setKoenInputValue] = React.useState("");
  const [showHotkeyPanel, setShowHotkeyPanel] = React.useState(false);
  const [hotkeys, setHotkeys] = React.useState({
    addRedZone: "q",
    addKill: "w",
    subtractKill: "r",
    addRaid: "e",
    addKoen: "=",
    subtractKoen: "-",
    resetSession: "",
  });
  const [listeningFor, setListeningFor] = React.useState(null);

  React.useEffect(() => {
    const timer = setInterval(() => {
      setElapsedSeconds(Math.floor((Date.now() - sessionStartTime) / 1000));
    }, 1000);
    return () => clearInterval(timer);
  }, [sessionStartTime]);

  React.useEffect(() => {
    const handleKeyDown = (event) => {
      if (listeningFor) {
        event.preventDefault();
        if (event.key === "Escape") {
          setListeningFor(null);
        } else {
          setHotkeys((prev) => ({
            ...prev,
            [listeningFor]: event.key.toLowerCase(),
          }));
          setListeningFor(null);
        }
        return;
      }

      if (
        document.activeElement &&
        document.activeElement.tagName === "INPUT"
      ) {
        return;
      }

      const key = event.key.toLowerCase();

      if (key === hotkeys.addRedZone) {
        event.preventDefault();
        updateStat("redZones", 1);
      } else if (key === hotkeys.addKill) {
        event.preventDefault();
        updateStat("kills", 1);
      } else if (key === hotkeys.subtractKill) {
        event.preventDefault();
        updateStat("kills", -1);
      } else if (key === hotkeys.addRaid) {
        event.preventDefault();
        updateStat("raidsCompleted", 1);
      } else if (key === hotkeys.addKoen) {
        event.preventDefault();
        updateStat("koenEarned", 1000);
      } else if (key === hotkeys.subtractKoen) {
        event.preventDefault();
        updateStat("koenEarned", -1000);
      } else if (key === hotkeys.resetSession && hotkeys.resetSession !== "") {
        event.preventDefault();
        resetSession();
      }
    };

    window.addEventListener("keydown", handleKeyDown);
    return () => window.removeEventListener("keydown", handleKeyDown);
  }, [hotkeys, listeningFor]);

  const formatTime = (seconds) => {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return `${h.toString().padStart(2, "0")}:${m
      .toString()
      .padStart(2, "0")}:${s.toString().padStart(2, "0")}`;
  };

  const updateStat = (key, delta) => {
    setStats((prev) => ({
      ...prev,
      [key]:
        key === "koenEarned"
          ? prev[key] + delta
          : Math.max(0, prev[key] + delta),
    }));
    sendToAgent({
      action: "update_stat",
      instruction: `Streamer updated ${key} by ${delta > 0 ? "+" : ""}${delta}`,
      data: { stat: key, delta, newValue: stats[key] + delta },
    });
  };

  const subtractKoenExact = () => {
    const value = parseInt(koenInputValue, 10);
    if (!isNaN(value) && value >= 0) {
      const newValue = stats.koenEarned - value;
      setStats((prev) => ({
        ...prev,
        koenEarned: newValue,
      }));
      sendToAgent({
        action: "update_stat",
        instruction: `Streamer subtracted ${value} from koenEarned`,
        data: { stat: "koenEarned", delta: -value, newValue: newValue },
      });
      setKoenInputValue("");
    }
  };

  const addKoenExact = () => {
    const value = parseInt(koenInputValue, 10);
    if (!isNaN(value) && value >= 0) {
      const newValue = stats.koenEarned + value;
      setStats((prev) => ({
        ...prev,
        koenEarned: newValue,
      }));
      sendToAgent({
        action: "update_stat",
        instruction: `Streamer added ${value} to koenEarned`,
        data: { stat: "koenEarned", delta: value, newValue: newValue },
      });
      setKoenInputValue("");
    }
  };

  const setKoenExact = () => {
    const value = parseInt(koenInputValue, 10);
    if (!isNaN(value)) {
      setStats((prev) => ({
        ...prev,
        koenEarned: value,
      }));
      sendToAgent({
        action: "update_stat",
        instruction: `Streamer set koenEarned to exact value ${value}`,
        data: { stat: "koenEarned", newValue: value },
      });
      setKoenInputValue("");
    }
  };

  const resetSession = () => {
    setStats({ redZones: 0, kills: 0, koenEarned: 0, raidsCompleted: 0 });
    sendToAgent({
      action: "reset_session",
      instruction: "Streamer reset all session stats to zero",
      data: { timestamp: new Date().toISOString() },
    });
  };

  const statConfigs = [
    {
      key: "redZones",
      label: "Red Zones Found",
      icon: "🎯",
      color: "#FF4444",
      increment: 1,
      format: (v) => v.toString(),
    },
    {
      key: "kills",
      label: "Kills",
      icon: "💀",
      color: "#FF6B6B",
      increment: 1,
      format: (v) => v.toString(),
    },
    {
      key: "koenEarned",
      label: "Koen Earned",
      icon: "💰",
      color: "#FFB84D",
      increment: 1000,
      format: (v) => v.toLocaleString(),
    },
    {
      key: "raidsCompleted",
      label: "Raids Completed",
      icon: "🚩",
      color: "#4ECDC4",
      increment: 1,
      format: (v) => v.toString(),
    },
  ];

  const hotkeyConfigs = [
    { key: "addRedZone", label: "+1 Red Zone", defaultKey: "Q" },
    { key: "addKill", label: "+1 Kill", defaultKey: "W" },
    { key: "subtractKill", label: "-1 Kill", defaultKey: "R" },
    { key: "addRaid", label: "+1 Raid", defaultKey: "E" },
    { key: "addKoen", label: "+1,000 Koen", defaultKey: "=" },
    { key: "subtractKoen", label: "-1,000 Koen", defaultKey: "-" },
    { key: "resetSession", label: "Reset Session", defaultKey: "none" },
  ];

  return (
    <>
      {typeof widgetLog === "function" && widgetLog({ status: "success" })}
      <Card
        style={{
          width: "100%",
          maxWidth: "56rem",
          backgroundColor: "#0A0E12",
          backgroundImage:
            "repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 68, 68, 0.02) 2px, rgba(255, 68, 68, 0.02) 4px)",
          border: "1px solid #1F2937",
          fontFamily: "Rajdhani, Orbitron, monospace",
        }}
      >
        <CardHeader
          style={{
            borderBottom: "2px solid #FF4444",
            backgroundColor: "#141A20",
          }}
        >
          <div
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
            }}
          >
            <div>
              <CardTitle
                style={{
                  fontSize: "1.75rem",
                  fontWeight: "700",
                  color: "#E8E8E8",
                  letterSpacing: "0.05em",
                  textTransform: "uppercase",
                }}
              >
                Arena Breakout: Infinite — Stream Stats
              </CardTitle>
              <CardDescription
                style={{
                  color: "#9CA3AF",
                  fontSize: "0.875rem",
                  marginTop: "0.25rem",
                  fontFamily: "monospace",
                }}
              >
                Session ID:{" "}
                {data?.sessionData?.sessionId ?? "ABI-2024-01-28-001"}
              </CardDescription>
            </div>
            <div
              style={{
                backgroundColor: "#1F2937",
                padding: "0.75rem 1.25rem",
                borderRadius: "0.375rem",
                border: "1px solid #FF4444",
              }}
            >
              <div
                style={{
                  fontSize: "0.75rem",
                  color: "#9CA3AF",
                  marginBottom: "0.25rem",
                  textTransform: "uppercase",
                  letterSpacing: "0.1em",
                }}
              >
                Session Time
              </div>
              <div
                style={{
                  fontSize: "1.5rem",
                  fontWeight: "700",
                  color: "#FFB84D",
                  fontFamily: "monospace",
                }}
              >
                {formatTime(elapsedSeconds)}
              </div>
            </div>
          </div>
        </CardHeader>
        <CardContent style={{ padding: "1.5rem" }}>
          <div
            style={{
              display: "grid",
              gridTemplateColumns: "repeat(2, 1fr)",
              gap: "1rem",
              marginBottom: "1.5rem",
            }}
          >
            {statConfigs.map((config) => (
              <div
                key={config.key}
                style={{
                  backgroundColor: "#141A20",
                  border: "1px solid #1F2937",
                  borderRadius: "0.5rem",
                  padding: "1.25rem",
                  position: "relative",
                  overflow: "hidden",
                }}
              >
                <div
                  style={{
                    position: "absolute",
                    top: 0,
                    left: 0,
                    right: 0,
                    height: "3px",
                    backgroundColor: config.color,
                  }}
                />
                <div
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: "0.75rem",
                    marginBottom: "1rem",
                  }}
                >
                  <span style={{ fontSize: "2rem" }}>{config.icon}</span>
                  <div
                    style={{
                      fontSize: "0.875rem",
                      color: "#9CA3AF",
                      textTransform: "uppercase",
                      letterSpacing: "0.05em",
                      fontWeight: "600",
                    }}
                  >
                    {config.label}
                  </div>
                </div>
                <div
                  style={{
                    fontSize: "3.5rem",
                    fontWeight: "700",
                    color:
                      config.key === "koenEarned" && stats[config.key] < 0
                        ? "#FF4444"
                        : config.color,
                    lineHeight: 1,
                    marginBottom: "1rem",
                    fontFamily: "Orbitron, monospace",
                    textShadow:
                      config.key === "koenEarned" && stats[config.key] < 0
                        ? "0 0 20px #FF444440"
                        : `0 0 20px ${config.color}40`,
                  }}
                >
                  {config.format(stats[config.key])}
                </div>
                <div
                  style={{
                    display: "flex",
                    gap: "0.5rem",
                  }}
                >
                  <button
                    onClick={() => updateStat(config.key, -config.increment)}
                    style={{
                      flex: 1,
                      padding: "0.625rem",
                      backgroundColor: "#1F2937",
                      border: "1px solid #374151",
                      borderRadius: "0.375rem",
                      color: "#E8E8E8",
                      fontSize: "1.25rem",
                      fontWeight: "700",
                      cursor: "pointer",
                      transition: "all 200ms ease",
                    }}
                    onMouseEnter={(e) => {
                      e.currentTarget.style.backgroundColor = "#374151";
                      e.currentTarget.style.borderColor = config.color;
                    }}
                    onMouseLeave={(e) => {
                      e.currentTarget.style.backgroundColor = "#1F2937";
                      e.currentTarget.style.borderColor = "#374151";
                    }}
                  >
                    −{config.increment === 1000 ? "1K" : config.increment}
                  </button>
                  <button
                    onClick={() => updateStat(config.key, config.increment)}
                    style={{
                      flex: 1,
                      padding: "0.625rem",
                      backgroundColor: config.color,
                      border: "1px solid",
                      borderColor: config.color,
                      borderRadius: "0.375rem",
                      color: "#0A0E12",
                      fontSize: "1.25rem",
                      fontWeight: "700",
                      cursor: "pointer",
                      transition: "all 200ms ease",
                    }}
                    onMouseEnter={(e) => {
                      e.currentTarget.style.opacity = "0.85";
                    }}
                    onMouseLeave={(e) => {
                      e.currentTarget.style.opacity = "1";
                    }}
                  >
                    +{config.increment === 1000 ? "1K" : config.increment}
                  </button>
                </div>
                {config.key === "koenEarned" && (
                  <div
                    style={{
                      display: "flex",
                      gap: "0.5rem",
                      marginTop: "0.75rem",
                    }}
                  >
                    <input
                      type="number"
                      value={koenInputValue}
                      onChange={(e) => setKoenInputValue(e.target.value)}
                      placeholder="Enter exact amount..."
                      style={{
                        flex: 1,
                        padding: "0.625rem",
                        backgroundColor: "#1F2937",
                        border: "1px solid #FFB84D",
                        borderRadius: "0.375rem",
                        color: "#E8E8E8",
                        fontSize: "0.875rem",
                        fontFamily: "monospace",
                        outline: "none",
                      }}
                      onFocus={(e) => {
                        e.currentTarget.style.borderColor = "#FFB84D";
                        e.currentTarget.style.boxShadow =
                          "0 0 0 2px rgba(255, 184, 77, 0.2)";
                      }}
                      onBlur={(e) => {
                        e.currentTarget.style.boxShadow = "none";
                      }}
                    />
                    <button
                      onClick={subtractKoenExact}
                      style={{
                        padding: "0.625rem 0.75rem",
                        backgroundColor: "#1F2937",
                        border: "1px solid #FF4444",
                        borderRadius: "0.375rem",
                        color: "#FF4444",
                        fontSize: "0.875rem",
                        fontWeight: "700",
                        cursor: "pointer",
                        transition: "all 200ms ease",
                      }}
                      onMouseEnter={(e) => {
                        e.currentTarget.style.backgroundColor = "#374151";
                      }}
                      onMouseLeave={(e) => {
                        e.currentTarget.style.backgroundColor = "#1F2937";
                      }}
                    >
                      −
                    </button>
                    <button
                      onClick={addKoenExact}
                      style={{
                        padding: "0.625rem 0.75rem",
                        backgroundColor: "#FFB84D",
                        border: "1px solid #FFB84D",
                        borderRadius: "0.375rem",
                        color: "#0A0E12",
                        fontSize: "0.875rem",
                        fontWeight: "700",
                        cursor: "pointer",
                        transition: "all 200ms ease",
                      }}
                      onMouseEnter={(e) => {
                        e.currentTarget.style.opacity = "0.85";
                      }}
                      onMouseLeave={(e) => {
                        e.currentTarget.style.opacity = "1";
                      }}
                    >
                      +
                    </button>
                    <button
                      onClick={setKoenExact}
                      style={{
                        padding: "0.625rem 0.75rem",
                        backgroundColor: "#374151",
                        border: "1px solid #374151",
                        borderRadius: "0.375rem",
                        color: "#E8E8E8",
                        fontSize: "0.875rem",
                        fontWeight: "700",
                        cursor: "pointer",
                        transition: "all 200ms ease",
                        textTransform: "uppercase",
                        letterSpacing: "0.05em",
                      }}
                      onMouseEnter={(e) => {
                        e.currentTarget.style.backgroundColor = "#4B5563";
                      }}
                      onMouseLeave={(e) => {
                        e.currentTarget.style.backgroundColor = "#374151";
                      }}
                    >
                      SET
                    </button>
                  </div>
                )}
              </div>
            ))}
          </div>
          <div
            style={{
              display: "flex",
              gap: "1rem",
              padding: "1rem",
              backgroundColor: "#141A20",
              border: "1px solid #1F2937",
              borderRadius: "0.5rem",
            }}
          >
            <div style={{ flex: 1 }}>
              <div
                style={{
                  fontSize: "0.75rem",
                  color: "#9CA3AF",
                  marginBottom: "0.5rem",
                  textTransform: "uppercase",
                  letterSpacing: "0.05em",
                }}
              >
                Session Status
              </div>
              <div
                style={{
                  display: "inline-flex",
                  alignItems: "center",
                  gap: "0.5rem",
                  padding: "0.375rem 0.75rem",
                  backgroundColor: "#4ECDC4",
                  borderRadius: "0.25rem",
                  fontSize: "0.875rem",
                  fontWeight: "600",
                  color: "#0A0E12",
                }}
              >
                <span
                  style={{
                    width: "8px",
                    height: "8px",
                    borderRadius: "50%",
                    backgroundColor: "#0A0E12",
                    animation: "pulse 2s infinite",
                  }}
                />
                LIVE
              </div>
            </div>
            <button
              onClick={() => setShowHotkeyPanel(!showHotkeyPanel)}
              style={{
                padding: "0.75rem 1.5rem",
                backgroundColor: "#1F2937",
                border: "1px solid #FFB84D",
                borderRadius: "0.375rem",
                color: "#FFB84D",
                fontSize: "0.875rem",
                fontWeight: "700",
                textTransform: "uppercase",
                letterSpacing: "0.05em",
                cursor: "pointer",
                transition: "all 200ms ease",
              }}
              onMouseEnter={(e) => {
                e.currentTarget.style.backgroundColor = "#374151";
              }}
              onMouseLeave={(e) => {
                e.currentTarget.style.backgroundColor = "#1F2937";
              }}
            >
              ⌨️ HOTKEY SETTINGS
            </button>
            <button
              onClick={resetSession}
              style={{
                padding: "0.75rem 1.5rem",
                backgroundColor: "#1F2937",
                border: "1px solid #FF4444",
                borderRadius: "0.375rem",
                color: "#FF4444",
                fontSize: "0.875rem",
                fontWeight: "700",
                textTransform: "uppercase",
                letterSpacing: "0.05em",
                cursor: "pointer",
                transition: "all 200ms ease",
              }}
              onMouseEnter={(e) => {
                e.currentTarget.style.backgroundColor = "#FF4444";
                e.currentTarget.style.color = "#0A0E12";
              }}
              onMouseLeave={(e) => {
                e.currentTarget.style.backgroundColor = "#1F2937";
                e.currentTarget.style.color = "#FF4444";
              }}
            >
              🔄 Reset Session
            </button>
          </div>
          {showHotkeyPanel && (
            <div
              style={{
                marginTop: "1rem",
                padding: "1.5rem",
                backgroundColor: "#141A20",
                border: "1px solid #1F2937",
                borderRadius: "0.5rem",
              }}
            >
              <div
                style={{
                  fontSize: "1rem",
                  fontWeight: "700",
                  color: "#E8E8E8",
                  marginBottom: "1rem",
                  textTransform: "uppercase",
                  letterSpacing: "0.05em",
                }}
              >
                Hotkey Configuration
              </div>
              <div
                style={{
                  display: "grid",
                  gridTemplateColumns: "1fr",
                  gap: "0.5rem",
                  marginBottom: "1rem",
                }}
              >
                {hotkeyConfigs.map((config, index) => (
                  <div
                    key={config.key}
                    style={{
                      display: "flex",
                      justifyContent: "space-between",
                      alignItems: "center",
                      padding: "0.75rem 1rem",
                      backgroundColor: index % 2 === 0 ? "#0A0E12" : "#1F2937",
                      borderRadius: "0.375rem",
                    }}
                  >
                    <div
                      style={{
                        fontSize: "0.875rem",
                        color: "#E8E8E8",
                        fontWeight: "600",
                      }}
                    >
                      {config.label}
                    </div>
                    <button
                      onClick={() => setListeningFor(config.key)}
                      style={{
                        padding: "0.5rem 1rem",
                        backgroundColor: "#1F2937",
                        border: "1px solid #FFB84D",
                        borderRadius: "0.375rem",
                        color: "#FFB84D",
                        fontSize: "0.875rem",
                        fontWeight: "700",
                        fontFamily: "monospace",
                        cursor: "pointer",
                        minWidth: "120px",
                        textAlign: "center",
                        transition: "all 200ms ease",
                        boxShadow:
                          listeningFor === config.key
                            ? "0 0 10px rgba(255, 184, 77, 0.5)"
                            : "none",
                      }}
                      onMouseEnter={(e) => {
                        if (listeningFor !== config.key) {
                          e.currentTarget.style.backgroundColor = "#374151";
                        }
                      }}
                      onMouseLeave={(e) => {
                        e.currentTarget.style.backgroundColor = "#1F2937";
                      }}
                    >
                      {listeningFor === config.key ? (
                        <span style={{ color: "#9CA3AF" }}>
                          Press any key...
                        </span>
                      ) : hotkeys[config.key] === "" ? (
                        "unset"
                      ) : (
                        hotkeys[config.key].toUpperCase()
                      )}
                    </button>
                  </div>
                ))}
              </div>
              <div
                style={{
                  fontSize: "0.75rem",
                  color: "#9CA3AF",
                  fontStyle: "italic",
                  textAlign: "center",
                }}
              >
                Click a key binding then press any key to reassign. Press Escape
                to cancel.
              </div>
            </div>
          )}
        </CardContent>
      </Card>
    </>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ArenaBreakoutStreamStats />);
  </script>
</body>
</html>
